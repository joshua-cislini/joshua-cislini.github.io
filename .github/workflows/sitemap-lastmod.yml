name: Update sitemap lastmod
on:
  push:
    branches: [main]
    paths: ["index.html", "js/**", "fonts/**"]
permissions:
  contents: write
jobs:
  lastmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lastmod to today (UTC)
        run: |
          TODAY=$(date -u +%F)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|" sitemap.xml
          sed -i "s|\"dateModified\": \"[0-9-]*\"|\"dateModified\": \"${TODAY}\"|" index.html
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml index.html
          git diff --staged --quiet || git commit -m "chore: update lastmod" && git push
