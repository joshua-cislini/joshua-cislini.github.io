name: Update Sitemap Lastmod

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'pages/**/*.html'
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history to get modification dates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Sitemap
        run: node scripts/update-sitemap.mjs # Assuming you have a script for this

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "seo: update sitemap lastmod dates"
          file_pattern: "sitemap.xml"
