name: Update Site Data (Sitemap & OG Image)
on:
  push:
    branches: [main]
    paths: ["index.html", "js/**", "fonts/**", "scripts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
        
      - name: Install dependencies
        run: npm install
        
      - name: Generate new og-image.png
        run: node scripts/generate-og-image.mjs

      - name: Set lastmod to today (UTC)
        run: |
          TODAY=$(date -u +%F)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|" sitemap.xml
          sed -i "s|\"dateModified\": \"[0-9-]*\"|\"dateModified\": \"${TODAY}\"|" index.html
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml index.html og-image.png
          git diff --staged --quiet || (git commit -m "chore: auto-update sitemap and og-image" && git pull --rebase origin main && git push)