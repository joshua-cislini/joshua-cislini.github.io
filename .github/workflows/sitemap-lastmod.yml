name: Update Site Data (Sitemap & OG Image)

on:
  push:
    branches: [main]
    paths: ["index.html", "js/**", "fonts/**", "scripts/**", "package*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate new og-image.png
        run: node scripts/generate-og-image.mjs

      - name: Inject PCB Passcode Hash
        env:
          PCB_PASSCODE: ${{ secrets.PCB_SECRET_PASSCODE }}
        run: |
          # Fallback to default hash if repository secret is not set yet
          RAW_SECRET="${PCB_PASSCODE:-Hardware2026}"
          HASH=$(echo -n "$RAW_SECRET" | sha256sum | awk '{print $1}')
          sed -i "s/__PCB_SECRET_PLACEHOLDER__/${HASH}/g" js/main.js

      - name: Set lastmod to today (UTC)
        run: |
          TODAY=$(date -u +%F)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|" sitemap.xml
          sed -i "s|\"dateModified\": \"[0-9-]*\"|\"dateModified\": \"${TODAY}\"|" index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml index.html og-image.png js/main.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update sitemap, og-image, and pcb secret hash"
            git pull --rebase origin main
            git push origin main
          fi