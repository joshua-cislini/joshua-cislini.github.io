name: Update GitHub contribution chart
on:
  schedule: [{ cron: "17 3 * * *" }]   # daily, 03:17 UTC
  workflow_dispatch:                    # run manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generate chart data
        run: node scripts/generate-github-chart.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: joshua-cislini
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json
          git diff --staged --quiet || git commit -m "chore: update contribution chart" && git push
