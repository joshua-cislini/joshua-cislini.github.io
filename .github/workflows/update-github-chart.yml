name: Update GitHub Chart

on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate GitHub Chart
        run: node scripts/generate-github-chart.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update GitHub contribution chart"
          file_pattern: "data/github-contributions.json"

      - name: Send Cronitor Heartbeat
        if: success()
        run: curl -sS "https://cronitor.link/p/${{ secrets.CRONITOR_AUTH_KEY }}/pdup24?state=complete"

      - name: Send Cronitor Failure Heartbeat
        if: failure()
        run: curl -sS "https://cronitor.link/p/${{ secrets.CRONITOR_AUTH_KEY }}/pdup24?state=fail"