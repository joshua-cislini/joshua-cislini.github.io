<!-- Add this to your main HTML file -->

<!-- Right Column Structure -->
<div class="col-right">
  
  <!-- PCB Editor Card (Hidden by default, positioned above Contact) -->
  <div id="pcb-editor-card" class="card" style="display: none;">
    <div class="card-header">
      <h3>PCB Generator Settings</h3>
      <button id="close-pcb-btn" class="close-btn" aria-label="Close Settings">&times;</button>
    </div>
    <div class="card-body">
      <!-- Your existing sliders and configuration inputs go here -->
      <label for="density">Density</label>
      <input type="range" id="density" name="density" min="1" max="100">
      
      <label for="speed">Speed</label>
      <input type="range" id="speed" name="speed" min="1" max="100">
    </div>
  </div>

  <!-- Existing Contact Card -->
  <div class="contact-card card">
    <!-- Contact details here -->
  </div>

</div>

<!-- Make sure to load the separated scripts in order at the end of body -->
<script src="js/particles.js"></script>
<script src="js/circuit.js"></script>
<script src="js/main.js"></script>
