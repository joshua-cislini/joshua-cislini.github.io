<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Link Styling Demo</title>
  <style>
    /* --------------------------------------------------
       1. CSS Color Variables (Light & Dark Themes)
       -------------------------------------------------- */
    :root {
      /* Theme Switching Colors */
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;

      /* Shared Link System (Light Mode) */
      --link-color: #2563eb;
      --link-hover-color: #1d4ed8;
      --link-bg-hover: rgba(37, 99, 235, 0.08);
      --link-border: transparent;
      --link-border-hover: rgba(37, 99, 235, 0.2);
    }

    [data-theme="dark"] {
      /* Theme Switching Colors */
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
      --border-color: #334155;

      /* Shared Link System (Dark Mode) */
      --link-color: #60a5fa;
      --link-hover-color: #93c5fd;
      --link-bg-hover: rgba(96, 165, 250, 0.12);
      --link-border: transparent;
      --link-border-hover: rgba(96, 165, 250, 0.3);
    }

    /* --------------------------------------------------
       2. General Base & Layout Styles
       -------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--link-color);
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.5rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .section-card h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    .link-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    /* --------------------------------------------------
       3. Shared Link Styling (Navigation, Inline & Contacts)
       -------------------------------------------------- */
    /* Applied to standard links and contact links alike */
    a.custom-link,
    .nav-links a,
    .contact-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--link-color);
      background-color: transparent;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid var(--link-border);
      transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    /* Shared Hover & Focus States across both Light & Dark modes */
    a.custom-link:hover,
    .nav-links a:hover,
    .contact-links a:hover,
    a.custom-link:focus-visible,
    .nav-links a:focus-visible,
    .contact-links a:focus-visible {
      color: var(--link-hover-color);
      background-color: var(--link-bg-hover);
      border-color: var(--link-border-hover);
      outline: none;
    }

    a.custom-link:active,
    .nav-links a:active,
    .contact-links a:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <header>
    <h1>Site Title</h1>
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme">
      Toggle Light/Dark
    </button>
  </header>

  <main>
    <!-- Navigation Links -->
    <section class="section-card">
      <h2>Navigation Links</h2>
      <nav class="link-group nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
      </nav>
    </section>

    <!-- Inline Paragraph Text Links -->
    <section class="section-card">
      <h2>Inline Content</h2>
      <p>
        Check out my latest updates on the 
        <a href="#projects" class="custom-link">projects page</a> 
        or jump straight to the documentation.
      </p>
    </section>

    <!-- Contact Links matching exact same styles -->
    <section class="section-card">
      <h2>Contact Links</h2>
      <div class="link-group contact-links">
        <a href="mailto:example@email.com">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
          </svg>
          Email Me
        </a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub
        </a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/>
          </svg>
          LinkedIn
        </a>
      </div>
    </section>
  </main>

  <script>
    // Theme toggle interaction script
    const toggleBtn = document.getElementById('themeToggleBtn');
    const htmlElement = document.documentElement;

    toggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      htmlElement.setAttribute('data-theme', newTheme);
    });
  </script>
</body>
</html>
