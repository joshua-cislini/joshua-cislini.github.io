<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph image template (1200x630).

  Text placeholders (written as double curly braces around NAME, LINE1, LINE2, URL in the
  <text> elements below) are replaced by scripts/generate-og-image.mjs before rendering to PNG.
  Values must be XML-escaped (&amp; &lt; &gt;).
    NAME   main title            (DM Serif Display, ~106px, fits ~640px wide)
    LINE1  first subtitle        (Inter, white-ish)
    LINE2  second subtitle       (Inter, green)
    URL    footer URL            (Inter, grey)

  Panels (#panel-main, #panel-url) sit behind the text so the dot network does not
  clash with it. Their width attribute can be adjusted by the generator to fit
  longer or shorter text: roughly text width + 80px for #panel-main.

  Fonts must be installed or passed to the renderer as TTF/OTF: "DM Serif Display", "Inter".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- soft edge for the translucent panels -->
    <filter id="soft" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- background -->
  <rect id="bg" width="1200" height="630" fill="#0b100d"/>

  <!-- dot network (static; edit freely) -->
