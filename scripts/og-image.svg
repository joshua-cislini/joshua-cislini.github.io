  <rect id="panel-url" x="44" y="522" width="396" height="76" rx="22" fill="#0b100d" fill-opacity="0.66" filter="url(#soft)"/>

  <!-- text -->
  <text id="name"  x="80" y="301" font-family="'DM Serif Display', serif" font-size="106.7" fill="#ffffff">{{NAME}}</text>
  <text id="line1" x="85" y="369" font-family="Inter, sans-serif" font-weight="400" font-size="39.3" fill="#e2e8f0">{{LINE1}}</text>
